server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    # Rešava DNS u runtime-u (Docker internal DNS)
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Koristimo promenljivu da izbegnemo “host not found” pri startu
    set $php_upstream "wordpress:9000";

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Bezbedno parsiranje PHP fajlova
    location ~ \.php$ {
        # security: ne serviraj .php ako fajl ne postoji
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;

        # Runtime DNS resolve preko promenljive
        fastcgi_pass $php_upstream;

        # malo većih bafera i timeout za WP
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # (opciono) statika
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    client_max_body_size 20m;
}